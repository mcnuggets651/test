name: Temporary AIrsenal JAX process isolation fix

on:
  push:
    branches: [prototype/airsenal-chat]
    paths: [".github/workflows/airsenal-jax-process-isolation-fix.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/airsenal-chat
          fetch-depth: 0
          persist-credentials: true
      - name: Split prediction and optimization into fresh processes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experiments/airsenal_free
          cat > "$ROOT/prediction_worker.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          import random
          from pathlib import Path
          from typing import Any

          SCHEMA = "airsenal-chat-prediction-stage-v1"


          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()


          def load_object(path: Path) -> dict[str, Any]:
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise ValueError(f"expected object in {path}")
              return value


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--owner-state", type=Path, required=True)
              parser.add_argument("--horizon", type=int, choices=(3, 5), required=True)
              parser.add_argument("--output", type=Path, required=True)
              args = parser.parse_args(argv)

              from airsenal.framework.schema import session
              from airsenal.framework.season import CURRENT_SEASON
              from airsenal.scripts.fill_predictedscore_table import make_predictedscore_table

              owner = load_object(args.owner_state)
              if owner.get("schema") != "airsenal-chat-owner-state-v1":
                  raise ValueError("unexpected owner-state schema")
              target_gw = int(owner["target_gameweek"])
              gameweeks = list(range(target_gw, target_gw + args.horizon))
              if gameweeks[-1] > 38:
                  raise ValueError(
                      f"AIrsenal cannot produce requested H{args.horizon}: range extends beyond GW38"
                  )

              random.seed(42)
              db_path = Path(os.environ["AIRSENAL_DB_FILE"]).expanduser().resolve()
              pre_prediction_db_sha256 = sha256_file(db_path)
              prediction_tag = make_predictedscore_table(
                  gw_range=gameweeks,
                  season=CURRENT_SEASON,
                  include_bonus=True,
                  include_cards=True,
                  include_saves=True,
                  include_def_con=True,
                  tag_prefix=f"airsenal-chat-h{args.horizon}-",
                  dbsession=session,
              )
              post_prediction_db_sha256 = sha256_file(db_path)
              payload = {
                  "schema": SCHEMA,
                  "horizon": args.horizon,
                  "gameweeks": gameweeks,
                  "entry_id": int(owner["entry_id"]),
                  "target_gameweek": target_gw,
                  "prediction_tag": prediction_tag,
                  "pre_prediction_db_sha256": pre_prediction_db_sha256,
                  "post_prediction_db_sha256": post_prediction_db_sha256,
              }
              args.output.parent.mkdir(parents=True, exist_ok=True)
              args.output.write_text(
                  json.dumps(payload, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('experiments/airsenal_free')
          hw = root / 'horizon_worker.py'
          text = hw.read_text(encoding='utf-8')
          text = text.replace(
              '    parser.add_argument("--horizon", type=int, choices=(3, 5), required=True)\n    parser.add_argument("--output", type=Path, required=True)',
              '    parser.add_argument("--horizon", type=int, choices=(3, 5), required=True)\n    parser.add_argument("--prediction-manifest", type=Path, required=True)\n    parser.add_argument("--output", type=Path, required=True)',
          )
          old_imports = '''    import airsenal\n    from airsenal.framework.player import CandidatePlayer\n    from airsenal.framework.multiprocessing_utils import set_multiprocessing_start_method\n    from airsenal.framework.prediction_utils import get_recent_minutes_for_player\n    from airsenal.framework.schema import session\n    from airsenal.framework.season import CURRENT_SEASON\n    from airsenal.framework.squad import Squad\n    from airsenal.framework.utils import fastcopy, get_player, get_player_from_api_id, list_players\n    from airsenal.scripts import fill_transfersuggestion_table as opt\n    from airsenal.scripts.fill_predictedscore_table import make_predictedscore_table\n'''
          new_imports = '''    import airsenal\n    from airsenal.framework.multiprocessing_utils import set_multiprocessing_start_method\n    from airsenal.framework.schema import session\n    from airsenal.framework.season import CURRENT_SEASON\n    from airsenal.framework.squad import Squad\n    from airsenal.framework.utils import fastcopy, get_player, get_player_from_api_id, list_players\n    from airsenal.scripts import fill_transfersuggestion_table as opt\n'''
          if old_imports not in text:
              raise SystemExit('horizon import block not found')
          text = text.replace(old_imports, new_imports, 1)
          old_prediction = '''    random.seed(42)\n    db_path = Path(__import__("os").environ["AIRSENAL_DB_FILE"]).expanduser().resolve()\n    pre_prediction_db_sha256 = sha256_file(db_path)\n    prediction_tag = make_predictedscore_table(\n        gw_range=gameweeks,\n        season=CURRENT_SEASON,\n        include_bonus=True,\n        include_cards=True,\n        include_saves=True,\n        include_def_con=True,\n        tag_prefix=f"airsenal-chat-h{args.horizon}-",\n        dbsession=session,\n    )\n    post_prediction_db_sha256 = sha256_file(db_path)\n'''
          new_prediction = '''    random.seed(42)\n    db_path = Path(__import__("os").environ["AIRSENAL_DB_FILE"]).expanduser().resolve()\n    prediction_manifest = load_object(args.prediction_manifest)\n    if prediction_manifest.get("schema") != "airsenal-chat-prediction-stage-v1":\n        raise ValueError("unexpected prediction-stage schema")\n    if int(prediction_manifest.get("horizon") or 0) != args.horizon:\n        raise ValueError("prediction-stage horizon mismatch")\n    if prediction_manifest.get("gameweeks") != gameweeks:\n        raise ValueError("prediction-stage gameweek range mismatch")\n    if int(prediction_manifest.get("entry_id") or 0) != int(owner["entry_id"]):\n        raise ValueError("prediction-stage owner scope mismatch")\n    if int(prediction_manifest.get("target_gameweek") or 0) != target_gw:\n        raise ValueError("prediction-stage target Gameweek mismatch")\n    prediction_tag = str(prediction_manifest.get("prediction_tag") or "")\n    if not prediction_tag:\n        raise ValueError("prediction-stage tag missing")\n    pre_prediction_db_sha256 = str(prediction_manifest.get("pre_prediction_db_sha256") or "")\n    post_prediction_db_sha256 = str(prediction_manifest.get("post_prediction_db_sha256") or "")\n    if sha256_file(db_path) != post_prediction_db_sha256:\n        raise ValueError("prediction-stage DB hash mismatch before optimization")\n'''
          if old_prediction not in text:
              raise SystemExit('horizon prediction block not found')
          text = text.replace(old_prediction, new_prediction, 1)
          marker = '    if best_strategy is None:\n        raise ValueError("AIrsenal returned no multi-week strategy")\n\n'
          insert = marker + '    # Import prediction/JAX-facing helpers only after optimizer workers have joined.\n    from airsenal.framework.player import CandidatePlayer\n    from airsenal.framework.prediction_utils import get_recent_minutes_for_player\n\n'
          if marker not in text:
              raise SystemExit('post optimizer marker missing')
          text = text.replace(marker, insert, 1)
          hw.write_text(text, encoding='utf-8')

          op = root / 'operational.py'
          text = op.read_text(encoding='utf-8')
          pattern = re.compile(r'def run_horizon\(.*?\n\n\ndef build_context\(', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('run_horizon block not found')
          replacement = '''def run_horizon(\n    *,\n    script_dir: Path,\n    run_dir: Path,\n    base_db: Path,\n    base_db_sha256: str,\n    owner_path: Path,\n    owner: dict[str, Any],\n    horizon: int,\n    scenario_path: Path | None,\n) -> dict[str, Any]:\n    hdir = run_dir / f"h{horizon}"\n    hdir.mkdir(parents=True, exist_ok=False)\n    db_copy = hdir / "data.db"\n    shutil.copy2(base_db, db_copy)\n    if sha256_file(db_copy) != base_db_sha256:\n        raise OperationalError(f"HORIZON_FAILED: H{horizon} DB copy hash mismatch")\n    home = hdir / "home"\n    home.mkdir()\n    env = safe_runtime_env(home, db_copy, int(owner["entry_id"]))\n\n    prediction_path = hdir / "prediction_stage.json"\n    prediction_command = [\n        sys.executable,\n        str(script_dir / "prediction_worker.py"),\n        "--owner-state",\n        str(owner_path),\n        "--horizon",\n        str(horizon),\n        "--output",\n        str(prediction_path),\n    ]\n    run_logged(\n        prediction_command,\n        cwd=script_dir,\n        env=env,\n        log_path=hdir / "prediction.log",\n        label=f"HORIZON_FAILED: H{horizon} AIrsenal prediction stage",\n    )\n    prediction = load_object(prediction_path, f"H{horizon} prediction stage")\n    expected_gws = list(range(int(owner["target_gameweek"]), int(owner["target_gameweek"]) + horizon))\n    if prediction.get("schema") != "airsenal-chat-prediction-stage-v1":\n        raise OperationalError(f"HORIZON_FAILED: H{horizon} prediction-stage schema mismatch")\n    if int(prediction.get("horizon") or 0) != horizon or prediction.get("gameweeks") != expected_gws:\n        raise OperationalError(f"HORIZON_FAILED: H{horizon} prediction-stage scope mismatch")\n    if prediction.get("pre_prediction_db_sha256") != base_db_sha256:\n        raise OperationalError(f"HORIZON_FAILED: H{horizon} prediction did not start from frozen base DB")\n    if prediction.get("post_prediction_db_sha256") != sha256_file(db_copy):\n        raise OperationalError(f"HORIZON_FAILED: H{horizon} prediction DB hash mismatch")\n\n    result_path = hdir / "result.json"\n    command = [\n        sys.executable,\n        str(script_dir / "horizon_worker.py"),\n        "--owner-state",\n        str(owner_path),\n        "--horizon",\n        str(horizon),\n        "--prediction-manifest",\n        str(prediction_path),\n        "--output",\n        str(result_path),\n    ]\n    if scenario_path is not None:\n        command += ["--scenario", str(scenario_path)]\n    run_logged(\n        command,\n        cwd=script_dir,\n        env=env,\n        log_path=hdir / "worker.log",\n        label=f"HORIZON_FAILED: H{horizon} AIrsenal optimization stage",\n    )\n    return validate_horizon_result(\n        result_path,\n        horizon=horizon,\n        entry_id=int(owner["entry_id"]),\n        target_gw=int(owner["target_gameweek"]),\n        base_db_sha256=base_db_sha256,\n    )\n\n\ndef build_context('''
          text = text[:match.start()] + replacement + text[match.end():]
          op.write_text(text, encoding='utf-8')

          tc = root / 'test_contracts.py'
          text = tc.read_text(encoding='utf-8')
          anchor = '    def test_no_fpl_write_commands_in_runtime(self):\n'
          test = '''    def test_prediction_and_optimizer_are_process_isolated_without_quality_reduction(self):\n        worker = (ROOT / "horizon_worker.py").read_text(encoding="utf-8")\n        operational_text = (ROOT / "operational.py").read_text(encoding="utf-8")\n        predictor = (ROOT / "prediction_worker.py").read_text(encoding="utf-8")\n        self.assertIn("make_predictedscore_table", predictor)\n        self.assertNotIn("make_predictedscore_table", worker)\n        self.assertIn("--prediction-manifest", worker)\n        prediction_call = operational_text.index('str(script_dir / "prediction_worker.py")')\n        optimizer_call = operational_text.index('str(script_dir / "horizon_worker.py")')\n        self.assertLess(prediction_call, optimizer_call)\n        optimize_index = worker.index("opt.run_optimization(")\n        candidate_import_index = worker.index("from airsenal.framework.player import CandidatePlayer")\n        self.assertLess(optimize_index, candidate_import_index)\n        self.assertIn('"num_iterations": int(raw.get("num_iterations", 100))', worker)\n        self.assertIn('"num_thread": int(raw.get("num_thread", 4))', worker)\n\n'''
          if anchor not in text:
              raise SystemExit('test anchor missing')
          text = text.replace(anchor, test + anchor, 1)
          tc.write_text(text, encoding='utf-8')

          for name in ('README.md', 'OPERATIONS.md'):
              p = root / name
              text = p.read_text(encoding='utf-8')
              marker = '## macOS JAX/optimizer process isolation'
              if marker not in text:
                  text += '''\n\n## macOS JAX/optimizer process isolation\n\nEach H3/H5 horizon now runs AIrsenal prediction generation and transfer optimization in separate fresh Python processes against the same isolated DB copy. This deliberately lets the prediction/JAX process terminate before AIrsenal creates its fork-based optimizer workers, avoiding the upstream-documented JAX + `os.fork()` deadlock class without reducing horizons, optimizer iterations, worker count, transfer search limits, or model components. The prediction-stage tag and pre/post DB hashes are verified before optimization begins.\n'''
              p.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile "$ROOT/prediction_worker.py" "$ROOT/horizon_worker.py" "$ROOT/operational.py"
          (cd "$ROOT" && python3 -m unittest test_contracts.py test_operational.py test_owner_state.py test_publish_chat_bridge.py)
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/prediction_worker.py" "$ROOT/horizon_worker.py" "$ROOT/operational.py" "$ROOT/test_contracts.py" "$ROOT/README.md" "$ROOT/OPERATIONS.md"
          git commit -m 'Isolate AIrsenal prediction from forked optimizer'
          git push origin HEAD:prototype/airsenal-chat
