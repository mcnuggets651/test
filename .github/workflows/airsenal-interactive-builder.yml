name: Temporary AIrsenal interactive-profile builder

on:
  push:
    branches: [prototype/airsenal-chat]
    paths: [".github/workflows/airsenal-interactive-builder.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/airsenal-chat
          fetch-depth: 0
          persist-credentials: true
      - name: Add bounded interactive AIrsenal search profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('experiments/airsenal_free')
          hw = root / 'horizon_worker.py'
          text = hw.read_text(encoding='utf-8')

          old = 'allowed = {"max_total_hit", "allow_unused_transfers", "max_opt_transfers", "num_iterations", "num_thread", "chip_gameweeks"}'
          new = 'allowed = {"profile_name", "max_total_hit", "allow_unused_transfers", "max_opt_transfers", "future_max_opt_transfers", "num_iterations", "num_thread", "chip_gameweeks"}'
          if old not in text:
              raise SystemExit('scenario allowed-key anchor missing')
          text = text.replace(old, new, 1)

          old = '''    out = {
        "max_total_hit": int(raw.get("max_total_hit", 8)),
        "allow_unused_transfers": bool(raw.get("allow_unused_transfers", False)),
        "max_opt_transfers": int(raw.get("max_opt_transfers", 2)),
        "num_iterations": int(raw.get("num_iterations", 100)),
        "num_thread": int(raw.get("num_thread", 4)),
        "chip_gameweeks": {},
    }
'''
          new = '''    current_cap = int(raw.get("max_opt_transfers", 2))
    out = {
        "profile_name": str(raw.get("profile_name", "reference")),
        "max_total_hit": int(raw.get("max_total_hit", 8)),
        "allow_unused_transfers": bool(raw.get("allow_unused_transfers", False)),
        "max_opt_transfers": current_cap,
        "future_max_opt_transfers": int(raw.get("future_max_opt_transfers", current_cap)),
        "num_iterations": int(raw.get("num_iterations", 100)),
        "num_thread": int(raw.get("num_thread", 4)),
        "chip_gameweeks": {},
    }
'''
          if old not in text:
              raise SystemExit('scenario output anchor missing')
          text = text.replace(old, new, 1)

          old = '''    if out["max_opt_transfers"] < 0 or out["max_opt_transfers"] > 5:
        raise ValueError("max_opt_transfers must be between 0 and 5")
'''
          new = '''    if out["max_opt_transfers"] < 0 or out["max_opt_transfers"] > 5:
        raise ValueError("max_opt_transfers must be between 0 and 5")
    if out["future_max_opt_transfers"] < 0 or out["future_max_opt_transfers"] > out["max_opt_transfers"]:
        raise ValueError("future_max_opt_transfers must be between 0 and max_opt_transfers")
    if not out["profile_name"] or len(out["profile_name"]) > 64:
        raise ValueError("profile_name must be a non-empty string up to 64 characters")
'''
          if old not in text:
              raise SystemExit('scenario validation anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''    return out\n\n\ndef main(argv: list[str] | None = None) -> int:\n'''
          helper = '''    return out\n\n\ndef transfer_cap_for_strategy(strat: tuple[Any, ...], current_cap: int, future_cap: int) -> int:\n    \"\"\"Use the full transfer cap for the decision GW and a bounded cap later.\n\n    AIrsenal future routes are planning evidence and are re-optimized in later GWs, so\n    interactive mode avoids exhaustive future two-transfer pair searches while keeping\n    the current-GW 0/1/2-transfer decision exact.\n    \"\"\"\n    try:\n        strat_dict = strat[2]\n        points_per_gw = strat_dict.get(\"points_per_gw\", {}) if isinstance(strat_dict, dict) else {}\n    except (IndexError, TypeError, AttributeError):\n        points_per_gw = {}\n    return current_cap if len(points_per_gw) == 0 else future_cap\n\n\ndef main(argv: list[str] | None = None) -> int:\n'''
          if anchor not in text:
              raise SystemExit('helper insertion anchor missing')
          text = text.replace(anchor, helper, 1)

          old = '''    def exact_starting_squad(*_args: Any, **_kwargs: Any) -> Squad:
        return build_starting_squad()

    with patch.object(opt, "get_entry_start_gameweek", return_value=1), patch.object(opt, "get_starting_squad", side_effect=exact_starting_squad):
        _best_squad, best_strategy = opt.run_optimization(
'''
          new = '''    def exact_starting_squad(*_args: Any, **_kwargs: Any) -> Squad:
        return build_starting_squad()

    upstream_next_week_transfers = opt.next_week_transfers

    def bounded_next_week_transfers(strat: tuple[Any, ...], *call_args: Any, **call_kwargs: Any) -> Any:
        cap = transfer_cap_for_strategy(
            strat,
            scenario["max_opt_transfers"],
            scenario["future_max_opt_transfers"],
        )
        requested = int(call_kwargs.get("max_opt_transfers", scenario["max_opt_transfers"]))
        call_kwargs["max_opt_transfers"] = min(requested, cap)
        return upstream_next_week_transfers(strat, *call_args, **call_kwargs)

    with (
        patch.object(opt, "get_entry_start_gameweek", return_value=1),
        patch.object(opt, "get_starting_squad", side_effect=exact_starting_squad),
        patch.object(opt, "next_week_transfers", side_effect=bounded_next_week_transfers),
    ):
        _best_squad, best_strategy = opt.run_optimization(
'''
          if old not in text:
              raise SystemExit('optimizer patch anchor missing')
          text = text.replace(old, new, 1)

          old = '''        "optimizer": {
            "settings": scenario,
            "raw_strategy": best_strategy_json,
'''
          new = '''        "optimizer": {
            "settings": scenario,
            "search_profile": scenario["profile_name"],
            "search_scope": {
                "current_gameweek_max_transfers": scenario["max_opt_transfers"],
                "future_gameweek_max_transfers": scenario["future_max_opt_transfers"],
                "full_reference_transfer_tree": scenario["future_max_opt_transfers"] == scenario["max_opt_transfers"],
            },
            "raw_strategy": best_strategy_json,
'''
          if old not in text:
              raise SystemExit('optimizer result anchor missing')
          text = text.replace(old, new, 1)
          hw.write_text(text, encoding='utf-8')

          run = root / 'run.sh'
          text = run.read_text(encoding='utf-8')
          text = text.replace('DOCTOR_ONLY=0\n', 'DOCTOR_ONLY=0\nPROFILE="interactive"\nHAS_SCENARIO=0\n', 1)
          old = '''    --doctor-only) DOCTOR_ONLY=1 ;;
'''
          new = '''    --doctor-only) DOCTOR_ONLY=1 ;;
    --scenario)
      HAS_SCENARIO=1
      i=$((i + 1))
      [[ $i -lt ${#args[@]} ]] || safe_fail "ARGUMENT_VALIDATION_FAILED" 2
      ;;
    --scenario=*) HAS_SCENARIO=1 ;;
    --reference) PROFILE="reference" ;;
    --interactive) PROFILE="interactive" ;;
'''
          if old not in text:
              raise SystemExit('run.sh parse anchor missing')
          text = text.replace(old, new, 1)
          old = '''for arg in "${args[@]}"; do
  [[ "$arg" == "--doctor-only" ]] && continue
  filtered+=("$arg")
done

run_guarded "OPERATIONAL_FAILED" \\
'''
          new = '''for arg in "${args[@]}"; do
  [[ "$arg" == "--doctor-only" ]] && continue
  [[ "$arg" == "--reference" ]] && continue
  [[ "$arg" == "--interactive" ]] && continue
  filtered+=("$arg")
done

if [[ $HAS_SCENARIO -eq 0 && "$PROFILE" == "interactive" ]]; then
  filtered+=("--scenario" "$SCRIPT_DIR/interactive_scenario.json")
fi

run_guarded "OPERATIONAL_FAILED" \\
'''
          if old not in text:
              raise SystemExit('run.sh filtered anchor missing')
          text = text.replace(old, new, 1)
          run.write_text(text, encoding='utf-8')

          (root / 'interactive_scenario.json').write_text('''{
  "profile_name": "interactive-v1",
  "max_total_hit": 4,
  "allow_unused_transfers": false,
  "max_opt_transfers": 2,
  "future_max_opt_transfers": 1,
  "num_iterations": 100,
  "num_thread": 4,
  "chip_gameweeks": {}
}
''', encoding='utf-8')

          (root / 'test_interactive_profile.py').write_text('''from __future__ import annotations

import json
import unittest
from pathlib import Path

import horizon_worker

ROOT = Path(__file__).resolve().parent


class InteractiveProfileTests(unittest.TestCase):
    def test_reference_defaults_are_unchanged(self):
        scenario = horizon_worker.validate_scenario({}, 4, None)
        self.assertEqual(scenario["profile_name"], "reference")
        self.assertEqual(scenario["max_opt_transfers"], 2)
        self.assertEqual(scenario["future_max_opt_transfers"], 2)
        self.assertEqual(scenario["num_iterations"], 100)
        self.assertEqual(scenario["num_thread"], 4)

    def test_interactive_profile_preserves_current_two_transfer_search(self):
        raw = json.loads((ROOT / "interactive_scenario.json").read_text(encoding="utf-8"))
        scenario = horizon_worker.validate_scenario(raw, 4, None)
        self.assertEqual(scenario["profile_name"], "interactive-v1")
        self.assertEqual(scenario["max_total_hit"], 4)
        self.assertEqual(scenario["max_opt_transfers"], 2)
        self.assertEqual(scenario["future_max_opt_transfers"], 1)
        self.assertEqual(scenario["num_iterations"], 100)
        self.assertEqual(scenario["num_thread"], 4)

    def test_transfer_cap_is_full_at_root_and_bounded_later(self):
        root = (2, 0, {"points_per_gw": {}})
        future = (2, 0, {"points_per_gw": {4: 50.0}})
        self.assertEqual(horizon_worker.transfer_cap_for_strategy(root, 2, 1), 2)
        self.assertEqual(horizon_worker.transfer_cap_for_strategy(future, 2, 1), 1)

    def test_run_sh_defaults_to_interactive_but_keeps_reference_escape_hatch(self):
        body = (ROOT / "run.sh").read_text(encoding="utf-8")
        self.assertIn('PROFILE="interactive"', body)
        self.assertIn('interactive_scenario.json', body)
        self.assertIn('--reference', body)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY

          bash -n experiments/airsenal_free/run.sh
          python3 -m compileall -q experiments/airsenal_free
          python3 -m unittest discover -s experiments/airsenal_free -p 'test_*.py' -v
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/airsenal_free/horizon_worker.py experiments/airsenal_free/run.sh experiments/airsenal_free/interactive_scenario.json experiments/airsenal_free/test_interactive_profile.py
          git commit -m 'Add interactive AIrsenal H3/H5 search profile'
          git push origin HEAD:prototype/airsenal-chat
