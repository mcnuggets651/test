name: AIrsenal Chat Free Acceptance

on:
  push:
    branches: [prototype/airsenal-chat]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  synthetic-contracts:
    name: Synthetic privacy and transport contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Shell syntax
        run: bash -n experiments/airsenal_free/bootstrap.sh experiments/airsenal_free/run.sh
      - name: Compile integration
        run: python -m compileall -q experiments/airsenal_free
      - name: Run synthetic tests
        run: python -m unittest discover -s experiments/airsenal_free -p "test_*.py" -v
