name: Dastan SmartPlay Free Acceptance

on:
  push:
    branches:
      - prototype/dastan-smartplay
    paths:
      - experiments/dastan_smartplay_free/**
      - .github/workflows/dastan-smartplay-free.yml
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dastan-smartplay-free-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gw4-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/dastan_smartplay_free
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pure adapter and strategy unit tests
        run: python -m unittest -v test_live_gw.py test_strategy.py

      - name: Install pinned free stack and refreshed public mappings
        run: bash bootstrap_v2.sh

      - name: Export, parity and acceptance regression tests
        run: .venv/bin/python -m unittest -v test_live_gw_v2.py test_check_acceptance.py test_strategy.py

      - name: Prepare public offline solver runtime
        run: |
          mkdir -p output/wheels
          .venv/bin/python -m pip download --only-binary=:all: --no-deps highspy==1.11.0 -d output/wheels
          tar --exclude=.git -czf output/smartplay-solver-src.tgz -C .vendor/smartplayfpl-solver .
          printf '%s\n' '7ec56e944982020f8709db5d00b0b78821fb1f38' > output/smartplay-solver-src.sha

      - name: Generate genuine GW4 open-Dastan projections
        run: |
          .venv/bin/python live_gw_v2.py \
            --gameweek 4 \
            --dastan-repo .vendor/smartplayfpl-dastan \
            --smartplay-public-repo .vendor/smartplayfpl-public \
            --work-dir "$RUNNER_TEMP/dastan-smartplay-free" \
            --output-dir output \
            --reference smartplay_gw4_spotcheck.csv

      - name: Validate SmartPlay Solver projection contract
        run: .venv/bin/smartplay-solver validate-projections output/dastan_gw4_solver.csv --gameweek 4 --horizon 1

      - name: Validate open stack and hosted-parity diagnostic
        run: .venv/bin/python check_acceptance.py output/dastan_gw4_acceptance.json --parity-mode auto

      - name: Upload public acceptance/runtime bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dastan-gw4-public-${{ github.sha }}
          path: |
            experiments/dastan_smartplay_free/output/dastan_gw4_solver.csv
            experiments/dastan_smartplay_free/output/dastan_gw4_acceptance.json
            experiments/dastan_smartplay_free/output/wheels/*.whl
            experiments/dastan_smartplay_free/output/smartplay-solver-src.tgz
            experiments/dastan_smartplay_free/output/smartplay-solver-src.sha
          if-no-files-found: error
          retention-days: 1

      - name: Print acceptance evidence
        if: always()
        run: |
          if [[ -f output/dastan_gw4_acceptance.json ]]; then
            cat output/dastan_gw4_acceptance.json
          fi
          if [[ -f output/dastan_gw4_solver.csv ]]; then
            echo '--- top solver rows ---'
            head -n 21 output/dastan_gw4_solver.csv
          fi
