name: Temporary AIrsenal multiprocessing fix

on:
  push:
    branches: [prototype/airsenal-chat]
    paths: [".github/workflows/airsenal-multiprocessing-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/airsenal-chat
          fetch-depth: 0
          persist-credentials: true
      - name: Apply upstream-intended multiprocessing initialization and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('experiments/airsenal_free/horizon_worker.py')
          text = worker.read_text(encoding='utf-8')
          import_anchor = '    from airsenal.framework.player import CandidatePlayer\n'
          import_line = '    from airsenal.framework.multiprocessing_utils import set_multiprocessing_start_method\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('multiprocessing import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          call_anchor = '    from airsenal.scripts.fill_predictedscore_table import make_predictedscore_table\n\n'
          call_text = (
              '    from airsenal.scripts.fill_predictedscore_table import make_predictedscore_table\n\n'
              '    # AIrsenal requires fork on POSIX/macOS for its optimizer workers.\n'
              '    # Its CLI/pipeline entrypoints call this helper before run_optimization;\n'
              '    # this direct integration must preserve that upstream initialization.\n'
              '    set_multiprocessing_start_method()\n\n'
          )
          if '    set_multiprocessing_start_method()\n' not in text:
              if call_anchor not in text:
                  raise SystemExit('multiprocessing call anchor missing')
              text = text.replace(call_anchor, call_text, 1)
          worker.write_text(text, encoding='utf-8')

          contracts = Path('experiments/airsenal_free/test_contracts.py')
          text = contracts.read_text(encoding='utf-8')
          anchor = '    def test_no_fpl_write_commands_in_runtime(self):\n'
          test = '''    def test_horizon_worker_initialises_upstream_multiprocessing_before_optimizer(self):\n        text = (ROOT / "horizon_worker.py").read_text(encoding="utf-8")\n        self.assertIn(\n            "from airsenal.framework.multiprocessing_utils import set_multiprocessing_start_method",\n            text,\n        )\n        init_index = text.index("set_multiprocessing_start_method()")\n        optimize_index = text.index("opt.run_optimization(")\n        self.assertLess(init_index, optimize_index)\n\n'''
          if 'test_horizon_worker_initialises_upstream_multiprocessing_before_optimizer' not in text:
              if anchor not in text:
                  raise SystemExit('contract test anchor missing')
              text = text.replace(anchor, test + anchor, 1)
          contracts.write_text(text, encoding='utf-8')
          PY

          (cd experiments/airsenal_free && python3 -m unittest test_contracts.py)
          python3 -m py_compile experiments/airsenal_free/horizon_worker.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/airsenal_free/horizon_worker.py experiments/airsenal_free/test_contracts.py
          git commit -m 'Initialize AIrsenal multiprocessing before horizon optimization'
          git push origin HEAD:prototype/airsenal-chat
