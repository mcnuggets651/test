[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-price-risk"
version = "0.1.0"
description = "Standalone shadow FPL price-change forecasting and route-risk diagnostics"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pyyaml>=6.0,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
apex-price-risk = "apex_price_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apex_price_risk"]
